name: Docs checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # weekly, catches outside links that broke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Links, anchors and privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_docs.py

  external-links:
    name: Outside links (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --accept 200,206,429 --exclude-path LICENSE --exclude '^https?://(www\.)?(x|twitter)\.com' --exclude '/templates/(link|url)$' './**/*.md'
          fail: true
