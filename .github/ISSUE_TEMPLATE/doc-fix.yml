name: Fix or improve the docs
description: Something is wrong, unclear, out of date or missing.
title: "Docs: "
labels: ["documentation"]
body:
  - type: input
    id: file
    attributes:
      label: Which file?
      placeholder: e.g. developer-fellowship/GUIDELINES.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong, and what should it say?
    validations:
      required: true
