name: Question about the fellowship
description: Ask something the docs don't answer. We add good questions to the FAQ.
title: "Question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        This is a public issue. Please don't share private details here (email, wallet addresses, personal circumstances). To apply, use [codeorange.dev/fellowships/apply](https://codeorange.dev/fellowships/apply).
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: checked
    attributes:
      label: Which doc did you check first? (optional)
      placeholder: e.g. shared/faq.md
